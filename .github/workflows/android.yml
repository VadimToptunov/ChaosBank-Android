name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog & cross-platform parity
        # A defect lands on both platforms in paired PRs with the same branch name,
        # so a PR compares against the sibling's same-named branch when it exists,
        # and against the sibling's main otherwise (and always after merge).
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          SIBLING=https://raw.githubusercontent.com/VadimToptunov/ChaosBank-iOS
          URL="$SIBLING/main/exercises.json"
          if [ -n "$BRANCH" ] && curl -sfo /dev/null "$SIBLING/$BRANCH/exercises.json"; then
            URL="$SIBLING/$BRANCH/exercises.json"
          fi
          echo "Parity against $URL"
          python3 scripts/check_exercises.py exercises.json AND "$URL"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (standard flavor)
        run: ./gradlew :app:testStandardDebugUnitTest --stacktrace

      - name: Coverage gate (JaCoCo, logic layer ≥ 90%)
        run: ./gradlew :app:jacocoCoverageVerification --stacktrace

      - name: Coverage report
        run: ./gradlew :app:jacocoTestReport --stacktrace

      - name: Assemble standard debug APK
        run: ./gradlew :app:assembleStandardDebug --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/html
